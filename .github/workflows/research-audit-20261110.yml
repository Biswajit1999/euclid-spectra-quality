name: Independent research diagnostics 2026-11-10
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standalone numerical regression tests
        run: python -m unittest discover -s research -p 'test_group_dependence_20261110.py' -v
